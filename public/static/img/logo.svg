<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#21437d"/><stop offset="1" stop-color="#0b1220"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2f7de1"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e6fb"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="222" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#ring)" stroke-width="14" filter="url(#glow)"/>
  <!-- Antenne -->
  <line x1="256" y1="176" x2="256" y2="132" stroke="#8fd0ff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="120" r="17" fill="#5aa9ff" filter="url(#glow)"/>
  <!-- Sprechblase = Bot-Kopf -->
  <path d="M154 176 H358 a44 44 0 0 1 44 44 V316 a44 44 0 0 1 -44 44 H252 l-50 42 l8 -42 H154 a44 44 0 0 1 -44 -44 V220 a44 44 0 0 1 44 -44 Z" fill="url(#bubble)"/>
  <!-- Augen -->
